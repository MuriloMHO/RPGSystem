
name: Deploy RPGSystem to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor application
        run: dotnet publish RPGSystem.Web/RPGSystem.Web.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/RPGSystem/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
